# v* 태그를 푸시하면 Windows·macOS 설치본을 빌드해 GitHub Releases 초안(draft) **하나**에 올린다.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# 굽는 일과 올리는 일을 갈라 놓았다. 예전에는 두 잡이 각각 `--publish always`를 돌렸는데,
# 둘 다 "이 태그의 draft가 없다"고 판단하는 순간이 겹치면 **각자 draft를 하나씩 만든다**(#46).
# 실제로 0.4.0에서 그렇게 갈라졌고, 하필 갈라진 것이 `latest.yml`과 `latest-mac.yml`이었다 —
# 그 둘이 한 릴리스에 있어야 두 플랫폼의 자동 업데이트가 돈다.
#
# 그래서 각 잡은 굽기만 하고(`--publish never`) 결과를 artifact로 올린다. 둘 다 끝난 뒤
# 마지막 잡 하나가 그것을 받아 draft를 **한 번에** 만든다. 릴리스 노트를 쓰고 Publish하는 것은
# 지금처럼 사람이 한다.
#
# 코드 서명은 아직 없다 — 맥 잡의 CSC_IDENTITY_AUTO_DISCOVERY=false가 키체인 탐색을 꺼서
# 서명 없이 빌드를 통과시킨다. 서명을 넣을 때 CSC_LINK 등 시크릿과 함께 이 줄을 지운다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # dist/ 아래에는 win-unpacked 같은 중간 산출물도 있다 — 릴리스에 올릴 것만 고른다.
      # latest*.yml은 자동 업데이트가 읽는 파일이라 빠지면 안 된다.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # dist의 실제 파일명에는 공백이 있다(`Claude Office Setup 0.4.0.exe`). 그대로 올리면
      # GitHub이 공백을 '.'으로 바꾸는데, 같이 올라가는 latest*.yml은 '-'로 바꾼 이름을
      # 가리킨다 — 어긋나면 자동 업데이트가 404를 받는다(#48). yml 쪽에 맞춘다.
      - name: Match asset names to latest*.yml
        run: |
          shopt -s nullglob
          for f in dist/*" "*; do mv -- "$f" "${f// /-}"; done
          ls -l dist

      # 이름이 어긋나도 릴리스는 성공한 것처럼 보이고 자산 개수도 맞는다 — 사람 눈에 기대지 않는다.
      #
      # url을 뽑는 데 `grep -oP`를 쓰지 않는다. 로케일에 따라 "-P supports only unibyte and
      # UTF-8 locales"로 죽는데, 그러면 읽을 url이 하나도 없어 **검사가 통과해 버린다.**
      # 그래서 한 줄도 못 뽑은 경우 자체를 실패로 본다 — 검증이 조용히 무력화되는 쪽이
      # 어긋난 이름보다 위험하다.
      - name: Verify latest*.yml points at real files
        run: |
          bad=0
          for y in dist/latest*.yml; do
            urls=$(sed -n 's/^.*url: *//p' "$y")
            if [ -z "$urls" ]; then
              echo "::error::$y has no url entries — the check would pass without checking anything"
              bad=1
              continue
            fi
            while read -r u; do
              [ -n "$u" ] || continue
              if [ -f "dist/$u" ]; then
                echo "ok  $u"
              else
                echo "::error::$y references missing asset: $u"
                bad=1
              fi
            done <<< "$urls"
          done
          [ "$bad" = 0 ]

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --title "Claude Office ${TAG#v}" --notes "" dist/*
