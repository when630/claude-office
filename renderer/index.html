<!doctype html>
<!-- lang은 app.mjs가 설정에 맞춰 갈아 끼운다 (기본값은 폰트·줄바꿈이 무난한 en) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Claude Office</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦀</text></svg>" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 상단바는 세 덩이다 — 왼쪽은 이름, 가운데는 상태, 오른쪽은 도구와 수치.
         전에는 여덟 항목이 `·`로 이어진 한 줄이었고 전부 같은 크기여서, 이 앱의 존재
         이유인 "입력 대기"가 토큰 총량과 같은 무게로 읽혔다. -->
    <header id="topbar">
      <h1>Claw'd Office</h1>
      <!-- 대기만 **채워진 칩**으로 세운다. 워드마크도 노랑이지만 그건 글자색이라 형태가
           다르고, 여기만 배경이 차 있어 눈이 먼저 온다. 대기가 없으면 사라진다. -->
      <button id="wait-chip" type="button" hidden></button>
      <div id="stats"></div>
      <div class="right">
        <!-- 수치는 늘 있지만 급하지 않다 — 모노스페이스로 가라앉혀 자리만 지킨다 -->
        <div id="usage-mini"></div>
        <!-- 이름으로 거르기. 방이 서넛일 때는 쓸 일이 없어 눈에 안 띄게 두고,
             걸러진 방이 생기면 옆의 배지가 그 사실을 알린다. -->
        <input id="room-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="topbar.filter" />
        <button id="room-shown" class="btn btn-pill" type="button" hidden></button>
        <span id="clock"></span>
        <button id="mini-open" class="btn" type="button" data-i18n-title="topbar.mini">▭</button>
        <button id="att-open" class="btn" type="button" data-i18n="topbar.attendance" data-i18n-title="topbar.attendance"></button>
        <button id="cfg-open" class="btn" type="button" data-i18n="topbar.settings" data-i18n-title="topbar.settings"></button>
      </div>
    </header>

    <!-- 미니 모드의 손잡이. 프레임 없는 창이라 여기가 유일한 드래그 영역이고,
         큰 창으로 돌아가는 길도 여기 있다. 평소에는 style.css가 감춰 둔다. -->
    <header id="mini-bar">
      <span id="mini-stats"></span>
      <button id="mini-grow" class="btn btn-quiet" type="button" data-i18n-title="mini.grow">▣</button>
    </header>

    <main>
      <!-- 전부 걸러지거나 접히면 빈 화면이 남는데, 그건 고장으로 읽힌다 — 이유를 적어 둔다 -->
      <div id="stage"><canvas id="office"></canvas><p id="stage-empty" hidden></p></div>
      <aside id="panel"></aside>
    </main>

    <!-- 한 번 읽으면 되는 안내는 기본 화면에서 빼고 여기 접어둔다.
         뼈대는 고정이고 문구만 app.mjs가 채운다(data-i18n) — 언어를 바꾸면 다시 채워진다. -->
    <button id="help-open" class="btn btn-round" type="button" data-i18n-title="help.button" aria-expanded="false" aria-controls="help">?</button>
    <div id="help" hidden>
      <h3 data-i18n="help.title"></h3>
      <ul class="legend">
        <li><span class="chip real"></span><span data-i18n="help.real"></span></li>
        <li><span class="chip idle"></span><span data-i18n="help.idle"></span></li>
      </ul>
      <p data-i18n="help.hint"></p>
    </div>

    <!-- 설정. <dialog>를 쓰면 배경 차단과 Esc 닫기가 공짜로 따라온다.
         내용은 app.mjs가 열 때마다 지금 떠 있는 방으로 다시 짠다. -->
    <dialog id="cfg">
      <header>
        <h2 data-i18n="cfg.title"></h2>
        <button id="cfg-close" class="btn" type="button" data-i18n="common.close" data-i18n-title="common.close"></button>
      </header>
      <!-- 설정이 다섯 갈래로 늘어 한 두루마리에 다 세우면 찾는 데 스크롤이 필요하다.
           탭 바는 헤더 아래 고정이고, 아래 몸통만 굴러간다. -->
      <nav id="cfg-tabs" role="tablist"></nav>
      <div id="cfg-body"></div>
      <!-- ? 설명이 떠오르는 자리. 창의 자식이고 position: fixed다 — dialog는 top layer라 그 안의
           고정 요소도 위에 그려지고, 스크롤되는 몸통 밖이라 잘리지 않는다. -->
      <div class="caption" hidden></div>
    </dialog>

    <!-- 출근부. 열 때마다 main에서 집계를 받아 온다(스냅샷과 달리 밀려 오지 않는다). -->
    <dialog id="att">
      <header>
        <h2 data-i18n="att.title"></h2>
        <button id="att-close" class="btn" type="button" data-i18n="common.close" data-i18n-title="common.close"></button>
      </header>
      <!-- 내용이 여섯 갈래로 늘어 한 두루마리에 다 세우면 찾는 데 스크롤이 필요하다.
           탭은 **무엇을 보나**이고 구간(오늘/최근 7일)은 그 안의 토글이다 — 두 축을 한 줄에
           섞으면 무엇을 고르는 것인지 흐려진다. -->
      <nav id="att-tabs" role="tablist"></nav>
      <div id="att-body"></div>
      <div class="caption" hidden></div>
    </dialog>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
