<!doctype html>
<!-- lang은 app.mjs가 설정에 맞춰 갈아 끼운다 (기본값은 폰트·줄바꿈이 무난한 en) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Claude Office</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦀</text></svg>" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="topbar">
      <h1>Claw'd Office</h1>
      <div id="stats"></div>
      <div class="right">
        <span id="clock"></span>
        <button id="att-open" type="button" data-i18n="topbar.attendance" data-i18n-title="topbar.attendance"></button>
        <button id="cfg-open" type="button" data-i18n="topbar.settings" data-i18n-title="topbar.settings"></button>
      </div>
    </header>

    <main>
      <div id="stage"><canvas id="office"></canvas></div>
      <aside id="panel"></aside>
    </main>

    <!-- 한 번 읽으면 되는 안내는 기본 화면에서 빼고 여기 접어둔다.
         뼈대는 고정이고 문구만 app.mjs가 채운다(data-i18n) — 언어를 바꾸면 다시 채워진다. -->
    <button id="help-open" type="button" data-i18n-title="help.button" aria-expanded="false" aria-controls="help">?</button>
    <div id="help" hidden>
      <h3 data-i18n="help.title"></h3>
      <ul class="legend">
        <li><span class="chip real"></span><span data-i18n="help.real"></span></li>
        <li><span class="chip idle"></span><span data-i18n="help.idle"></span></li>
      </ul>
      <p data-i18n="help.hint"></p>
    </div>

    <!-- 설정. <dialog>를 쓰면 배경 차단과 Esc 닫기가 공짜로 따라온다.
         내용은 app.mjs가 열 때마다 지금 떠 있는 방으로 다시 짠다. -->
    <dialog id="cfg">
      <header>
        <h2 data-i18n="cfg.title"></h2>
        <button id="cfg-close" type="button" data-i18n="common.close" data-i18n-title="common.close"></button>
      </header>
      <div id="cfg-body"></div>
    </dialog>

    <!-- 출근부. 열 때마다 main에서 집계를 받아 온다(스냅샷과 달리 밀려 오지 않는다). -->
    <dialog id="att">
      <header>
        <h2 data-i18n="att.title"></h2>
        <button id="att-close" type="button" data-i18n="common.close" data-i18n-title="common.close"></button>
      </header>
      <div id="att-body"></div>
    </dialog>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
