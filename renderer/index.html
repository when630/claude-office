<!doctype html>
<!-- lang은 app.mjs가 설정에 맞춰 갈아 끼운다 (기본값은 폰트·줄바꿈이 무난한 en) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Claude Office</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦀</text></svg>" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 헤더는 형제 앱 문법이다 — 워드마크 → 대기 칩 → (오른쪽) 패널 탭 → 시각 → 최소화·닫기.
         OS 제목 표시줄이 없으므로(frame: false) **여기가 드래그 바다**(style.css의 #topbar).
         전에는 여덟 항목이 `·`로 이어진 한 줄이었고 전부 같은 크기여서, 이 앱의 존재 이유인
         "입력 대기"가 토큰 총량과 같은 무게로 읽혔다. 지금은 헤더에 남은 수치가 대기 하나뿐이다 —
         상태 수치·토큰·사용률은 하단 상태줄(#statusbar)로 내려갔다(#208). -->
    <header id="topbar">
      <!-- 점이 상태등이다 — app.mjs가 waiting·broken class를 건다 -->
      <h1>Claude Office</h1>
      <!-- 대기만 **채워진 칩**으로 세운다. 헤더에서 유일하게 배경이 차 있어 눈이 먼저 온다.
           대기가 없으면 사라진다. -->
      <button id="wait-chip" type="button" hidden></button>
      <div class="right">
        <!-- 패널 탭(세션 · 출근부 · 설정). 패널 안에 있다가 헤더로 올라왔다 — 패널을 접어 둔
             채로도 보이고, 형제 앱과 같은 자리다. 내용은 app.mjs의 drawPanelTabs가 채운다. -->
        <nav id="panel-tabs" role="tablist"></nav>
        <span id="clock"></span>
        <!-- 최소화·닫기. 닫기는 트레이로 내려간다(main의 close 처리 그대로). 맥은 OS 신호등이
             있어 style.css가 숨긴다(body.mac). -->
        <div id="winbtns">
          <button id="win-min" type="button" data-icon="winMin" data-i18n-title="topbar.minimize"></button>
          <button id="win-close" type="button" data-icon="winClose" data-i18n-title="topbar.close"></button>
        </div>
      </div>
    </header>

    <!-- 미니 모드의 손잡이. 프레임 없는 창이라 여기가 유일한 드래그 영역이고,
         큰 창으로 돌아가는 길도 여기 있다. 평소에는 style.css가 감춰 둔다. -->
    <header id="mini-bar">
      <span id="mini-stats"></span>
      <!-- 계정 사용률(5시간·주간). 큰 창의 #usage-mini와 같은 자리·같은 문구다 —
           오른쪽에서 가라앉아 있고, 손잡이가 좁으면 대기 숫자를 자르지 않게 먼저 접힌다. -->
      <span id="mini-usage" hidden></span>
      <button id="mini-grow" class="btn btn-quiet btn-ico" type="button" data-icon="winFull" data-i18n-title="mini.grow"></button>
    </header>

    <main>
      <!-- 왼쪽 세션 목록. 방이 열 개를 넘으면 캔버스를 눈으로 훑는 것이 느려지는데,
           상태별로 묶인 목록은 "지금 나를 기다리는 것"을 늘 맨 위에 세운다.
           거르기 칸도 여기로 올라왔다 — 목록을 찾는 도구가 목록 위에 있어야 한다. -->
      <aside id="rail">
        <div class="rail-head">
          <input id="room-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="topbar.filter" />
        </div>
        <div id="rail-list"></div>
      </aside>
      <!-- 전부 걸러지거나 접히면 빈 화면이 남는데, 그건 고장으로 읽힌다 — 이유를 적어 둔다 -->
      <div id="stage">
        <canvas id="office"></canvas>
        <p id="stage-empty" hidden></p>
        <!-- 양쪽 열 접기 손잡이. 접는 열 바로 옆, 무대 가장자리에 선다. -->
        <button id="rail-toggle" class="btn-toggle" type="button" data-icon="chevL" data-i18n-title="topbar.railToggle"></button>
        <button id="panel-toggle" class="btn-toggle" type="button" data-icon="chevR" data-i18n-title="topbar.panelToggle"></button>
      </div>
      <!-- 오른쪽 패널은 세 갈래다. 설정·출근부가 창(<dialog>)에서 여기로 들어왔다 —
           420px 창의 폭 압박이 사라지고, 사무실을 보면서 설정을 만질 수 있다.
           세 판의 뼈대는 **고정이고 숨겨 둔다.** 갈아 끼우면 안쪽 id가 매번 새로 생겨
           그때마다 이벤트를 다시 달아야 한다. -->
      <aside id="panel">
        <div id="panel-view">
          <div id="pane-session"></div>
          <div id="pane-att" hidden>
            <!-- 탭은 **무엇을 보나**이고 구간(오늘/최근 7일)은 그 안의 토글이다 — 두 축을
                 한 줄에 섞으면 무엇을 고르는 것인지 흐려진다. -->
            <nav id="att-tabs" role="tablist"></nav>
            <div id="att-body"></div>
          </div>
          <div id="pane-cfg" hidden>
            <nav id="cfg-tabs" role="tablist"></nav>
            <div id="cfg-body"></div>
          </div>
        </div>
      </aside>
    </main>

    <!-- 하단 상태줄. 늘 있지만 급한 적이 없는 것들이 여기 산다 — 헤더가 대기만 말하게 하려고 내려왔다. -->
    <footer id="statusbar">
      <div id="stats"></div>
      <!-- 수치는 모노스페이스로 가라앉혀 자리만 지킨다 -->
      <div id="usage-mini"></div>
      <!-- 걸러진 방이 있다는 배지. 목록을 접어 둔 동안에도 "화면이 다가 아니다"는 알려야 하고,
           여기가 푸는 문이다. -->
      <button id="room-shown" class="btn btn-pill" type="button" hidden></button>
      <div class="right">
        <!-- 모습 전환 — 사무실(지금) · 미니 · 산책. 셋이 배타라 이어붙인 토글이다. -->
        <div id="mode-seg" role="group">
          <button id="mode-normal" class="on" type="button" disabled data-i18n="topbar.modeNormal"></button>
          <button id="mini-open" type="button" data-i18n="topbar.modeMini" data-i18n-title="topbar.mini"></button>
          <button id="stroll-open" type="button" data-i18n="topbar.modeStroll" data-i18n-title="topbar.stroll"></button>
        </div>
        <span id="version"></span>
      </div>
    </footer>

    <!-- 한 번 읽으면 되는 안내는 기본 화면에서 빼고 여기 접어둔다.
         뼈대는 고정이고 문구만 app.mjs가 채운다(data-i18n) — 언어를 바꾸면 다시 채워진다. -->
    <button id="help-open" class="btn btn-round" type="button" data-i18n-title="help.button" aria-expanded="false" aria-controls="help">?</button>
    <div id="help" hidden>
      <h3 data-i18n="help.title"></h3>
      <ul class="legend">
        <li><span class="chip real"></span><span data-i18n="help.real"></span></li>
        <li><span class="chip idle"></span><span data-i18n="help.idle"></span></li>
      </ul>
      <p data-i18n="help.hint"></p>
    </div>

    <!-- `?` 설명이 떠오르는 자리. 전에는 창(<dialog>)마다 하나씩 있었다 — dialog가 top layer라
         그 안의 고정 요소가 위에 그려지는 것에 기대고 있었다. 창이 없어졌으니 하나로 족하고,
         패널을 기준으로 자리를 잡는다(app.mjs의 openCaption). -->
    <div class="caption" hidden></div>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
